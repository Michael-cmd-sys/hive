# git-cliff configuration — generates CHANGELOG.md from Conventional Commits.
# Run locally: `git cliff` (preview) or `git cliff --latest --prepend CHANGELOG.md`.

[changelog]
header = """
# Changelog\n
All notable changes to this project are documented here, grouped by release.
This project follows [Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
    {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
