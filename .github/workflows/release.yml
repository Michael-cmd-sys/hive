name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, builder: zigbuild }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, builder: zigbuild }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, builder: cargo }
          - { os: macos-latest, target: x86_64-apple-darwin, builder: cargo }
          - { os: macos-latest, target: aarch64-apple-darwin, builder: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        run: cargo install cargo-zigbuild --locked

      - name: Test
        run: cargo test --verbose

      - name: Build (cargo-zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage
          if [ "${{ matrix.builder }}" = "zigbuild" ] && [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/hive.exe stage/hive-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/hive stage/hive-${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-${{ matrix.target }}
          path: stage/*

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md

      - name: Create rolling prerelease (push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          prerelease: true
          name: Rolling build
          body: "Automated rolling build from `${{ github.sha }}` — production binaries for Linux, Windows, and macOS."
          files: dist/*

      - name: Create version release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body: ${{ steps.cliff.outputs.changelog }}
          files: dist/*
